name: Gerar build React

on:
  workflow_call:
    inputs:
      node_version:
        description: Versão do Node.js
        required: false
        type: string
        default: "18.19.1"

      working_directory:
        description: Diretório que contém o package.json
        required: false
        type: string
        default: "react"

      output_directory:
        description: Diretório gerado pelo build
        required: false
        type: string
        default: "public-react"

permissions:
  contents: read

jobs:
  build:
    name: Gerar build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Instalar dependências
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: Gerar build
        working-directory: ${{ inputs.working_directory }}
        run: npm run build

      - name: Validar build gerado
        env:
          OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
        run: |
          test -d "$OUTPUT_DIRECTORY"
          test -f "$OUTPUT_DIRECTORY/index.html"
          echo "Build gerado com sucesso em $OUTPUT_DIRECTORY"
